title: NWebsec.SessionSecurity
description: Improved session security for ASP.NET
theme: just-the-docs

# Served as a GitHub *project* site (no custom domain), so every link/asset must
# be prefixed with the repo path. baseurl makes links resolve correctly both
# locally (http://127.0.0.1:4000/Docs.SessionSecurity/) and in production
# (https://nwebsec.github.io/Docs.SessionSecurity/).
url: https://nwebsec.github.io
baseurl: "/Docs.SessionSecurity"

# Apply the just-the-docs layout (with sidebar nav) to every page.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# just-the-docs options
search_enabled: true
heading_anchors: true
aux_links:
  "NWebsec.SessionSecurity on GitHub":
    - "https://github.com/NWebsec/NWebsec.SessionSecurity"

# Color scheme supports "light" (default) and "dark"
color_scheme: dark

# Don't process the converted-from source or build helpers.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
